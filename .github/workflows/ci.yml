name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + GBDT + dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core deps + GBDT optional group + dev tools.
          # Note: the 'viz' extra does not exist; plotly is a separate optional group.
          pip install -e ".[gbdt,plotly,dev]"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Lint with ruff
        run: ruff check src/ tfm_benchmark/ tests/

  # ── Optional heavy-model test (manual trigger only) ─────────────────────
  test-tfms:
    name: "Test TFM models (manual)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install all dependencies (no GPU)
        run: |
          pip install -e ".[tabpfn,tabicl,gbdt,plotly,dev]"

      - name: Run full test suite
        run: pytest tests/ -v --tb=short
