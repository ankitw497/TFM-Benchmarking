name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + GBDT + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gbdt,viz,dev]"
          pip install ucimlrepo   # for dataset download in tests

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test — zero-shot benchmark on German Credit (GBDT + sklearn only)
        run: |
          python scripts/run_benchmark.py \
            --dataset german_credit \
            --phase zero_shot \
            --results-dir /tmp/ci_results \
            --no-cache
        # Note: TFM models (TabPFN, TabICL) are not installed in CI to keep it fast.
        # They emit a clear "Warning: X not available" message and are skipped.

      - name: Smoke test — scaling test on German Credit
        run: |
          python scripts/run_scaling_test.py \
            --dataset german_credit \
            --row-counts 200 500 800 \
            --results-dir /tmp/ci_results \
            --timeout 120

      - name: Lint with ruff
        run: ruff check src/ scripts/ tests/

      - name: Format check with black
        run: black --check src/ scripts/ tests/

  # ── Optional heavy-model test (manual trigger only) ─────────────────────
  test-tfms:
    name: "Test TFM models (manual)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install all dependencies (no GPU)
        run: |
          pip install -e ".[tabpfn,tabicl,gbdt,dl,viz,dev]"
          pip install ucimlrepo

      - name: Run full zero-shot benchmark on German Credit
        run: |
          python scripts/run_benchmark.py \
            --dataset german_credit \
            --phase zero_shot \
            --results-dir /tmp/ci_results_tfm \
            --no-cache
